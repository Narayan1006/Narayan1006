<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Narayan Singh, AI and backend systems" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="80%" cy="35%" r="55%">
      <stop offset="0" stop-color="#6B9A55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6B9A55" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="220" rx="12" fill="#0B0C0E"/>
  <rect width="1000" height="220" rx="12" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="219" rx="12" fill="none" stroke="#1F2328"/>

  <text x="48" y="58" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#6B9A55">SYSTEM: NARAYAN SINGH</text>
  <text x="48" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#EDEBE6">Narayan Singh</text>
  <text x="48" y="156" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#9A978F">AI and backend systems that show their evidence</text>
  <text x="48" y="190" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#6B9A55">STATUS: BUILDING  ·  SIGNAL: STABLE</text>

  <!-- faint static signal line -->
  <path d="M560 150 L610 150 L632 118 L656 178 L684 100 L712 162 L734 150 L960 150"
        fill="none" stroke="#6B9A55" stroke-opacity="0.18" stroke-width="2" stroke-linejoin="round"/>
  <!-- animated signal line -->
  <path d="M560 150 L610 150 L632 118 L656 178 L684 100 L712 162 L734 150 L960 150"
        fill="none" stroke="#6B9A55" stroke-width="2" stroke-linejoin="round"
        stroke-dasharray="500" stroke-dashoffset="500">
    <animate attributeName="stroke-dashoffset" from="500" to="0" dur="3.5s" repeatCount="indefinite"/>
  </path>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
